name: Weekly upstream Renovate

on:
  schedule:
    - cron: "15 17 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Open update pull requests
        type: boolean
        default: false

permissions: {}

concurrency:
  group: renovate-upstream

jobs:
  renovate:
    if: github.repository == 'SatoshiAndKin/aiosqlite'
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: SatoshiAndKin/aiosqlite/.github/workflows/renovate-upstream-reviewed-linux.yml@f69e0c52a67c1a5c1b7317f6826971f2ac89a76b
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && !inputs.apply }}
